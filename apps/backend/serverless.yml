service: eureka-flows-backend

useDotenv: true

provider:
    name: aws
    runtime: nodejs20.x
    architecture: x86_64
    region: ap-northeast-2
    stage: ${opt:stage, 'local'}
    timeout: 30
    memorySize: 512
    environment:
        STAGE: ${self:provider.stage}
        DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
        FLOWS_TABLE: ${self:service}-flows-${self:provider.stage}
        CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
        MESSAGES_TABLE: ${self:service}-messages-${self:provider.stage}
        PROPOSALS_TABLE: ${self:service}-proposals-${self:provider.stage}
        RUNS_TABLE: ${self:service}-runs-${self:provider.stage}
        RUN_NODES_TABLE: ${self:service}-run-nodes-${self:provider.stage}
        TRACES_TABLE: ${self:service}-traces-${self:provider.stage}
        ASSETS_TABLE: ${self:service}-assets-${self:provider.stage}
        SETTINGS_TABLE: ${self:service}-settings-${self:provider.stage}
        KMS_KEY_ID: !If [IsLocalStage, '', !Ref SettingsKmsKey]
        EXECUTION_QUEUE_URL: !If [IsLocalStage, '', !Ref ExecutionQueue]
        S3_BUCKET: !If [IsLocalStage, 'eureka-flows-local', !Ref AssetsBucket]
        CLOUDFRONT_DOMAIN: !If [IsLocalStage, '', !GetAtt AssetsDistribution.DomainName]
        WS_CALLBACK_ENDPOINT:
            !If [
                IsLocalStage,
                'http://localhost:8801',
                !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}',
            ]
        FFMPEG_PATH: ${self:custom.ffmpegPath.${self:provider.stage}, '/opt/bin/ffmpeg'}
        FFMPEG_TIMEOUT_MS: ${env:FFMPEG_TIMEOUT_MS, '840000'}
        ORCHESTRATOR_MODE: ${env:ORCHESTRATOR_MODE, 'openai'}
        AI_PROVIDER: ${env:AI_PROVIDER, 'openai'}
        OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-5.4-nano'}
        OPENAI_ORCHESTRATOR_MODEL: ${env:OPENAI_ORCHESTRATOR_MODEL, 'gpt-5.4-nano'}
        OPENAI_VISION_MODEL: ${env:OPENAI_VISION_MODEL, 'gpt-5.4-nano'}
        OPENAI_SEARCH_MODEL: ${env:OPENAI_SEARCH_MODEL, 'gpt-5.4-nano'}
        OPENAI_IMAGE_MODEL: ${env:OPENAI_IMAGE_MODEL, 'gpt-image-2'}
        OPENAI_IMAGE_QUALITY: ${env:OPENAI_IMAGE_QUALITY, 'low'}
        OPENAI_TTS_MODEL: ${env:OPENAI_TTS_MODEL, 'gpt-4o-mini-tts'}
        OPENAI_TTS_VOICE: ${env:OPENAI_TTS_VOICE, 'nova'}
        LOCAL_ASSET_BASE_URL: ${env:LOCAL_ASSET_BASE_URL, 'http://localhost:8800/_local-assets'}
        CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOriginsCsv.${self:provider.stage}, self:custom.corsAllowedOriginsCsv.local}
        APP_API_KEY: ${env:APP_API_KEY, ''}
        OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
        ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
        ELEVENLABS_API_KEY: ${env:ELEVENLABS_API_KEY, ''}
        NANOBANANA_API_KEY: ${env:NANOBANANA_API_KEY, ''}
    httpApi:
        cors:
            allowedOrigins: ${self:custom.corsAllowedOrigins.${self:provider.stage}, self:custom.corsAllowedOrigins.local}
            allowedHeaders:
                - Content-Type
                - Authorization
                - X-Api-Key
            allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
            allowCredentials: false
    iam:
        role:
            statements:
                # DynamoDB CRUD on all 9 tables + their GSIs
                - Effect: Allow
                  Action:
                      - dynamodb:GetItem
                      - dynamodb:PutItem
                      - dynamodb:UpdateItem
                      - dynamodb:DeleteItem
                      - dynamodb:Query
                      - dynamodb:Scan
                      - dynamodb:BatchGetItem
                      - dynamodb:BatchWriteItem
                  Resource:
                      - !GetAtt FlowsTable.Arn
                      - !GetAtt ConnectionsTable.Arn
                      - !GetAtt MessagesTable.Arn
                      - !Sub '${MessagesTable.Arn}/index/*'
                      - !GetAtt ProposalsTable.Arn
                      - !Sub '${ProposalsTable.Arn}/index/*'
                      - !GetAtt RunsTable.Arn
                      - !Sub '${RunsTable.Arn}/index/*'
                      - !GetAtt RunNodesTable.Arn
                      - !GetAtt TracesTable.Arn
                      - !Sub '${TracesTable.Arn}/index/*'
                      - !GetAtt AssetsTable.Arn
                      - !Sub '${AssetsTable.Arn}/index/*'
                      - !GetAtt SettingsTable.Arn
                # KMS for Settings (real stages only — Local stage skips KMS via base64 fallback)
                - Effect: Allow
                  Action:
                      - kms:Encrypt
                      - kms:Decrypt
                      - kms:GenerateDataKey
                  Resource:
                      !If [
                          IsLocalStage,
                          !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/_dummy_',
                          !GetAtt SettingsKmsKey.Arn,
                      ]
                # WebSocket — POST to @connections/* (used by execution-engine push notifications)
                - Effect: Allow
                  Action: execute-api:ManageConnections
                  Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/POST/@connections/*'
                # SQS execution queue
                - Effect: Allow
                  Action:
                      - sqs:SendMessage
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:GetQueueAttributes
                      - sqs:ChangeMessageVisibility
                  Resource:
                      - !GetAtt ExecutionQueue.Arn
                      - !GetAtt ExecutionDeadLetterQueue.Arn
                # S3 assets written by media blocks and read through CloudFront
                - Effect: Allow
                  Action:
                      - s3:PutObject
                      - s3:GetObject
                      - s3:DeleteObject
                  Resource: !Sub '${AssetsBucket.Arn}/*'

plugins:
    - serverless-esbuild
    - serverless-offline

custom:
    corsAllowedOrigins:
        local:
            - http://localhost:3000
            - http://127.0.0.1:3000
            - http://localhost:3001
            - http://127.0.0.1:3001
        dev:
            - https://flow-dev.eureka.codes
            - http://localhost:3000
            - http://localhost:3001
        prod:
            - https://flow.eureka.codes
    corsAllowedOriginsCsv:
        local: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
        dev: https://flow-dev.eureka.codes,http://localhost:3000,http://localhost:3001
        prod: https://flow.eureka.codes
    ffmpegPath:
        local: ${env:FFMPEG_PATH, '/opt/bin/ffmpeg'}
        dev: /opt/bin/ffmpeg
        prod: /opt/bin/ffmpeg
    esbuild:
        bundle: true
        minify: false
        sourcemap: true
        target: node20
        platform: node
        external:
            - '@aws-sdk/*'
        define:
            'require.resolve': 'undefined'
    serverless-offline:
        httpPort: 8800
        websocketPort: 8801
        noPrependStageInUrl: true

layers:
    ffmpeg:
        path: layers/ffmpeg
        name: ${self:service}-ffmpeg-${self:provider.stage}
        description: Static ffmpeg binary for Shorts video composition
        compatibleRuntimes:
            - nodejs20.x
        compatibleArchitectures:
            - x86_64

