service: eureka-flows-backend

provider:
    name: aws
    runtime: nodejs20.x
    region: ap-northeast-2
    stage: ${opt:stage, 'local'}
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - dynamodb:GetItem
                      - dynamodb:PutItem
                      - dynamodb:DeleteItem
                      - dynamodb:Scan
                      - dynamodb:Query
                  Resource:
                      - !GetAtt FlowsTable.Arn
                      - !GetAtt ConnectionsTable.Arn
                      - !GetAtt RunsTable.Arn
                      - !GetAtt RunNodesTable.Arn
                      - !GetAtt MessagesTable.Arn
                      - !GetAtt ProposalsTable.Arn
                      - !GetAtt TracesTable.Arn
                      - !GetAtt AssetsTable.Arn
                      - !GetAtt SettingsTable.Arn
                      - !Join ['/', [!GetAtt RunsTable.Arn, 'index/*']]
                      - !Join ['/', [!GetAtt MessagesTable.Arn, 'index/*']]
                      - !Join ['/', [!GetAtt ProposalsTable.Arn, 'index/*']]
                      - !Join ['/', [!GetAtt TracesTable.Arn, 'index/*']]
                      - !Join ['/', [!GetAtt AssetsTable.Arn, 'index/*']]
                - Effect: Allow
                  Action:
                      - kms:Encrypt
                      - kms:Decrypt
                  Resource: ${env:KMS_KEY_ARN, '*'}
                # WebSocket API Gateway @connections endpoint.
                # Required by ApiGatewayManagementApi.PostToConnectionCommand used in
                # apps/backend/src/adapters/aws/websocket-api.ts (called from
                # wsService.broadcastToFlow and the ws/default pong handler).
                # Resource pattern covers all stages of the WebSocket API in the account.
                - Effect: Allow
                  Action:
                      - execute-api:ManageConnections
                  Resource:
                      - arn:aws:execute-api:${self:provider.region}:*:*/${self:provider.stage}/POST/@connections/*
                      - arn:aws:execute-api:${self:provider.region}:*:*/${self:provider.stage}/GET/@connections/*
                      - arn:aws:execute-api:${self:provider.region}:*:*/${self:provider.stage}/DELETE/@connections/*
    environment:
        STAGE: ${self:provider.stage}
        DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
        FLOWS_TABLE: ${self:service}-flows-${self:provider.stage}
        CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
        RUNS_TABLE: ${self:service}-runs-${self:provider.stage}
        RUN_NODES_TABLE: ${self:service}-run-nodes-${self:provider.stage}
        MESSAGES_TABLE: ${self:service}-messages-${self:provider.stage}
        PROPOSALS_TABLE: ${self:service}-proposals-${self:provider.stage}
        TRACES_TABLE: ${self:service}-traces-${self:provider.stage}
        ASSETS_TABLE: ${self:service}-assets-${self:provider.stage}
        SETTINGS_TABLE: ${self:service}-settings-${self:provider.stage}
        KMS_KEY_ID: ${env:KMS_KEY_ID, ''}
        ORCHESTRATOR_MODE: ${env:ORCHESTRATOR_MODE, 'mock'}
        ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
        # WS callback endpoint — used by the HTTP process to broadcast via API GW Mgmt API.
        # In prod, each WS handler re-inits wsClient from event.requestContext (see handlers/ws/default.ts).
        # In local serverless-offline, the HTTP process never touches WS events, so we lazy-init from this env var.
        WS_CALLBACK_ENDPOINT: ${env:WS_CALLBACK_ENDPOINT, 'http://localhost:8801'}
    httpApi:
        cors: true

plugins:
    - serverless-esbuild
    - serverless-offline

custom:
    esbuild:
        bundle: true
        minify: false
        sourcemap: true
        target: node22
        platform: node
        external:
            - '@aws-sdk/*'
        define:
            'require.resolve': 'undefined'
    serverless-offline:
        httpPort: 8800
        websocketPort: 8801
        noPrependStageInUrl: true

