resources:
    Resources:
        FlowsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.FLOWS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH

        ConnectionsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.CONNECTIONS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: connectionId
                      AttributeType: S
                KeySchema:
                    - AttributeName: connectionId
                      KeyType: HASH
                TimeToLiveSpecification:
                    AttributeName: ttl
                    Enabled: true

        RunsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUNS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        RunNodesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUN_NODES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: nodeId
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                    - AttributeName: nodeId
                      KeyType: RANGE

        MessagesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.MESSAGES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: messageId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: messageId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        ProposalsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.PROPOSALS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: proposalId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: proposalId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        TracesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.TRACES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: traceId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: occurredAt
                      AttributeType: S
                    - AttributeName: runNodeKey
                      AttributeType: S
                KeySchema:
                    - AttributeName: traceId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-occurredAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL
                    # Sparse GSI: only traces with a non-null runNodeKey (runId#runNodeId)
                    # appear here, enabling direct Query without FilterExpression.
                    - IndexName: runNodeKey-occurredAt-index
                      KeySchema:
                          - AttributeName: runNodeKey
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        AssetsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.ASSETS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: assetId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: assetId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-createdAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        SettingsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.SETTINGS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: provider
                      AttributeType: S
                KeySchema:
                    - AttributeName: provider
                      KeyType: HASH
