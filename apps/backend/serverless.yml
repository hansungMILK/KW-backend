                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}/assets'
                  method: get

    assetGet:
        handler: src/handlers/http/assets/get-asset.main
        events:
            - httpApi:
                  path: '/assets/{assetId}'
                  method: get
            - httpApi:
                  path: '/_apis/assets/{assetId}'
                  method: get
            - httpApi:
                  path: '/_api_/assets/{assetId}'
                  method: get

    # ── Settings ──
    settingsList:
        handler: src/handlers/http/settings/list-api-keys.main
        events:
            - httpApi:
                  path: /settings/api-keys
                  method: get
            - httpApi:
                  path: /_apis/settings/api-keys
                  method: get
            - httpApi:
                  path: /_api_/settings/api-keys
                  method: get

    settingsPut:
        handler: src/handlers/http/settings/put-api-key.main
        events:
            - httpApi:
                  path: /settings/api-keys
                  method: put
            - httpApi:
                  path: /_apis/settings/api-keys
                  method: put
            - httpApi:
                  path: /_api_/settings/api-keys
                  method: put

    settingsDelete:
        handler: src/handlers/http/settings/delete-api-key.main
        events:
            - httpApi:
                  path: '/settings/api-keys/{provider}'
                  method: delete
            - httpApi:
                  path: '/_apis/settings/api-keys/{provider}'
                  method: delete
            - httpApi:
                  path: '/_api_/settings/api-keys/{provider}'
                  method: delete

    settingsVerify:
        handler: src/handlers/http/settings/verify-api-key.main
        events:
            - httpApi:
                  path: '/settings/api-keys/{provider}/verify'
                  method: post
            - httpApi:
                  path: '/_apis/settings/api-keys/{provider}/verify'
                  method: post
            - httpApi:
                  path: '/_api_/settings/api-keys/{provider}/verify'
                  method: post

    # ── Workers ──
    runWorker:
        handler: src/workers/run-worker.main
        memorySize: 4096
        timeout: 900
        layers:
            - !Ref FfmpegLambdaLayer
        events:
            - sqs:
                  arn: !GetAtt ExecutionQueue.Arn
                  batchSize: 1

    # ── Workflows (#5 #6 #7) ──
    workflowGenerate:
        handler: src/handlers/http/workflows/generate.main
        events:
            - httpApi:
                  path: '/workflows/{workflowId}/generate'
                  method: post
            - httpApi:
                  path: '/_apis/workflows/{workflowId}/generate'
                  method: post
            - httpApi:
                  path: '/_api_/workflows/{workflowId}/generate'
                  method: post

    workflowExecute:
        handler: src/handlers/http/workflows/execute.main
        timeout: 60
        events:
            - httpApi:
                  path: '/workflows/{workflowId}/execute'
                  method: post
            - httpApi:
                  path: '/_apis/workflows/{workflowId}/execute'
                  method: post
            - httpApi:
                  path: '/_api_/workflows/{workflowId}/execute'
                  method: post
            - httpApi:
                  path: '/workflows/{workflowId}/execute'
                  method: get
            - httpApi:
                  path: '/_apis/workflows/{workflowId}/execute'
                  method: get
            - httpApi:
                  path: '/_api_/workflows/{workflowId}/execute'
                  method: get

    workflowResults:
        handler: src/handlers/http/workflows/results.main
        events:
            - httpApi:
                  path: '/workflows/{workflowId}/executions/{executionId}/results'
                  method: get
            - httpApi:
                  path: '/_apis/workflows/{workflowId}/executions/{executionId}/results'
                  method: get
            - httpApi:
                  path: '/_api_/workflows/{workflowId}/executions/{executionId}/results'
                  method: get

    # ── WebSocket ──
    wsConnect:
        handler: src/handlers/ws/connect.main
        events:
            - websocket: $connect
    wsDisconnect:
        handler: src/handlers/ws/disconnect.main
        events:
            - websocket: $disconnect
    wsDefault:
        handler: src/handlers/ws/default.main
        events:
            - websocket: $default

resources:
    Conditions:
        # Local stage uses memDb (file-based) and KMS base64 fallback — skip KMS resource creation.
        IsLocalStage:
            Fn::Equals: ['${self:provider.stage}', 'local']
        IsRealStage:
            Fn::Not:
                - Fn::Equals: ['${self:provider.stage}', 'local']

    Resources:
        ExecutionDeadLetterQueue:
            Type: AWS::SQS::Queue
            Properties:
                QueueName: ${self:service}-execution-dlq-${self:provider.stage}
                MessageRetentionPeriod: 1209600

        ExecutionQueue:
            Type: AWS::SQS::Queue
            Properties:
                QueueName: ${self:service}-execution-${self:provider.stage}
                VisibilityTimeout: 5400
                RedrivePolicy:
                    deadLetterTargetArn: !GetAtt ExecutionDeadLetterQueue.Arn
                    maxReceiveCount: 3

        AssetsBucket:
            Type: AWS::S3::Bucket
            Properties:
                BucketName: !Sub '${self:service}-assets-${self:provider.stage}-${AWS::AccountId}'
                PublicAccessBlockConfiguration:
                    BlockPublicAcls: true
                    BlockPublicPolicy: true
                    IgnorePublicAcls: true
                    RestrictPublicBuckets: true
                CorsConfiguration:
                    CorsRules:
                        - AllowedMethods: [GET, HEAD]
                          AllowedOrigins: ${self:custom.corsAllowedOrigins.${self:provider.stage}, self:custom.corsAllowedOrigins.local}
                          AllowedHeaders: ['*']
                          MaxAge: 3000

        AssetsOriginAccessControl:
            Type: AWS::CloudFront::OriginAccessControl
            Properties:
                OriginAccessControlConfig:
                    Name: !Sub '${self:service}-assets-oac-${self:provider.stage}'
                    OriginAccessControlOriginType: s3
                    SigningBehavior: always
                    SigningProtocol: sigv4

        AssetsDistribution:
            Type: AWS::CloudFront::Distribution
            Properties:
                DistributionConfig:
                    Enabled: true
                    HttpVersion: http2
                    PriceClass: PriceClass_100
                    DefaultRootObject: ''
                    Origins:
                        - Id: AssetsS3Origin
                          DomainName: !GetAtt AssetsBucket.RegionalDomainName
                          OriginAccessControlId: !Ref AssetsOriginAccessControl
                          S3OriginConfig:
                              OriginAccessIdentity: ''
                    DefaultCacheBehavior:
                        TargetOriginId: AssetsS3Origin
                        ViewerProtocolPolicy: redirect-to-https
                        AllowedMethods: [GET, HEAD, OPTIONS]
                        CachedMethods: [GET, HEAD, OPTIONS]
                        Compress: true
                        ForwardedValues:
                            QueryString: false
                            Cookies:
                                Forward: none

        AssetsBucketPolicy:
            Type: AWS::S3::BucketPolicy
            Properties:
                Bucket: !Ref AssetsBucket
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowCloudFrontRead
                          Effect: Allow
                          Principal:
                              Service: cloudfront.amazonaws.com
                          Action: s3:GetObject
                          Resource: !Sub '${AssetsBucket.Arn}/*'
                          Condition:
                              StringEquals:
                                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AssetsDistribution}'

        FlowsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.FLOWS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH

        ConnectionsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.CONNECTIONS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: connectionId
                      AttributeType: S
                KeySchema:
                    - AttributeName: connectionId
                      KeyType: HASH
                TimeToLiveSpecification:
                    AttributeName: ttl
                    Enabled: true

        # ── Messages (PK=messageId, GSI=flowId+createdAt for listByFlow) ──
        MessagesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.MESSAGES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: messageId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: messageId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Proposals (PK=proposalId, GSI=flowId+createdAt) ──
        ProposalsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.PROPOSALS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: proposalId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: proposalId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Runs (PK=runId, GSI=flowId+createdAt) ──
        # NOTE: 감사표 비고는 startedAt 이지만 run-repository.ts 코드는 createdAt 사용 → 코드에 맞춤.
        RunsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUNS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── RunNodes (composite PK=runId + SK=nodeId) ──
        RunNodesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUN_NODES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: nodeId
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                    - AttributeName: nodeId
                      KeyType: RANGE

        # ── Traces (PK=traceId, GSI1=runId+occurredAt, GSI2=runNodeKey+occurredAt sparse) ──
        TracesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.TRACES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: traceId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: runNodeKey
                      AttributeType: S
                    - AttributeName: occurredAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: traceId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-occurredAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL
                    - IndexName: runNodeKey-occurredAt-index
                      KeySchema:
                          - AttributeName: runNodeKey
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Assets (PK=assetId, GSI=runId+createdAt) ──
        AssetsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.ASSETS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: assetId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: assetId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-createdAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Settings (PK=provider) ──
        SettingsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.SETTINGS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: provider
                      AttributeType: S
                KeySchema:
                    - AttributeName: provider
                      KeyType: HASH

        # ── KMS key for Settings encryption (real stages only) ──
        SettingsKmsKey:
            Type: AWS::KMS::Key
            Condition: IsRealStage
            Properties:
                Description: 'Encrypts API keys stored in SettingsTable for ${self:service}-${self:provider.stage}'
                EnableKeyRotation: true
                KeyPolicy:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowRootAccountAdmin
                          Effect: Allow
                          Principal:
                              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
                          Action: 'kms:*'
                          Resource: '*'

        SettingsKmsKeyAlias:
            Type: AWS::KMS::Alias
            Condition: IsRealStage
            Properties:
                AliasName: 'alias/${self:service}-settings-${self:provider.stage}'
                TargetKeyId: !Ref SettingsKmsKey

    Outputs:
        HttpApiUrl:
            Description: HTTP API endpoint for this stage
            Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
        WebSocketApiUrl:
            Description: WebSocket endpoint for this stage
            Value: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
        AssetsBucketName:
            Description: S3 bucket storing generated assets
            Value: !Ref AssetsBucket
        AssetsCloudFrontDomain:
            Description: CloudFront domain serving generated assets
            Value: !GetAtt AssetsDistribution.DomainName
        ExecutionQueueUrl:
            Description: SQS queue used by runWorker
            Value: !Ref ExecutionQueue
