    wsDisconnect:
        handler: src/handlers/ws/disconnect.main
        events:
            - websocket: $disconnect
    wsDefault:
        handler: src/handlers/ws/default.main
        events:
            - websocket: $default

resources:
    Conditions:
        # Local stage uses memDb (file-based) and KMS base64 fallback — skip KMS resource creation.
        IsLocalStage:
            Fn::Equals: ['${self:provider.stage}', 'local']
        IsRealStage:
            Fn::Not:
                - Fn::Equals: ['${self:provider.stage}', 'local']

    Resources:
        FlowsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.FLOWS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH

        ConnectionsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.CONNECTIONS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: connectionId
                      AttributeType: S
                KeySchema:
                    - AttributeName: connectionId
                      KeyType: HASH
                TimeToLiveSpecification:
                    AttributeName: ttl
                    Enabled: true

        # ── Messages (PK=messageId, GSI=flowId+createdAt for listByFlow) ──
        MessagesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.MESSAGES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: messageId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: messageId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Proposals (PK=proposalId, GSI=flowId+createdAt) ──
        ProposalsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.PROPOSALS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: proposalId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: proposalId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Runs (PK=runId, GSI=flowId+createdAt) ──
        # NOTE: 감사표 비고는 startedAt 이지만 run-repository.ts 코드는 createdAt 사용 → 코드에 맞춤.
        RunsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUNS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: flowId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: flowId-createdAt-index
                      KeySchema:
                          - AttributeName: flowId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── RunNodes (composite PK=runId + SK=nodeId) ──
        RunNodesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.RUN_NODES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: nodeId
                      AttributeType: S
                KeySchema:
                    - AttributeName: runId
                      KeyType: HASH
                    - AttributeName: nodeId
                      KeyType: RANGE

        # ── Traces (PK=traceId, GSI1=runId+occurredAt, GSI2=runNodeKey+occurredAt sparse) ──
        TracesTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.TRACES_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: traceId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: runNodeKey
                      AttributeType: S
                    - AttributeName: occurredAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: traceId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-occurredAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL
                    - IndexName: runNodeKey-occurredAt-index
                      KeySchema:
                          - AttributeName: runNodeKey
                            KeyType: HASH
                          - AttributeName: occurredAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Assets (PK=assetId, GSI=runId+createdAt) ──
        AssetsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.ASSETS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: assetId
                      AttributeType: S
                    - AttributeName: runId
                      AttributeType: S
                    - AttributeName: createdAt
                      AttributeType: S
                KeySchema:
                    - AttributeName: assetId
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: runId-createdAt-index
                      KeySchema:
                          - AttributeName: runId
                            KeyType: HASH
                          - AttributeName: createdAt
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        # ── Settings (PK=provider) ──
        SettingsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.SETTINGS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: provider
                      AttributeType: S
                KeySchema:
                    - AttributeName: provider
                      KeyType: HASH

        # ── KMS key for Settings encryption (real stages only) ──
        SettingsKmsKey:
            Type: AWS::KMS::Key
            Condition: IsRealStage
            Properties:
                Description: 'Encrypts API keys stored in SettingsTable for ${self:service}-${self:provider.stage}'
                EnableKeyRotation: true
                KeyPolicy:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowRootAccountAdmin
                          Effect: Allow
                          Principal:
                              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
                          Action: 'kms:*'
                          Resource: '*'

        SettingsKmsKeyAlias:
            Type: AWS::KMS::Alias
            Condition: IsRealStage
            Properties:
                AliasName: 'alias/${self:service}-settings-${self:provider.stage}'
                TargetKeyId: !Ref SettingsKmsKey
